<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram Bot</title>

    <link rel="stylesheet" href="style.css">

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="avatar">🤖</div>
        <div>
            <h2>MY BOT</h2>
            <p>Welcome back 👋</p>
        </div>
    </header>

    <div class="balance-card">
        <span>💰 Your Balance</span>
        <h1>৳ 0.00</h1>
        <small>Available Balance</small>
    </div>

    <h3 class="title">Menu</h3>

    <div class="grid">

        <button onclick="openPage('profile')">
            👤
            <span>Profile</span>
        </button>

        <button onclick="openPage('balance')">
            💰
            <span>Balance</span>
        </button>

        <button onclick="openPage('deposit')">
            💳
            <span>Deposit</span>
        </button>

        <button onclick="openPage('withdraw')">
            💸
            <span>Withdraw</span>
        </button>

        <button onclick="openPage('bonus')">
            🎁
            <span>Bonus</span>
        </button>

        <button onclick="openChannel()">
            📢
            <span>Channel</span>
        </button>

        <button onclick="openSupport()">
            💬
            <span>Support</span>
        </button>

        <button onclick="showAbout()">
            ℹ️
            <span>About</span>
        </button>

    </div>

    <div id="message" class="message"></div>

    <footer>
        <p>Powered by <b>MY BOT</b> ⚡</p>
    </footer>

</div>

<script src="script.js"></script>

</body>
  </html>
